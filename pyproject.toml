[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-core"
version = "0.1.0"
description = "AI-powered code compliance and security reviewer for regulated industries (BFSI/FinTech)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "compliance", "BFSI", "FinTech", "SAST", "AI"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # CLI
    "click>=8.1",
    "rich>=13.0",
    # AI / LLM
    "openai>=1.30",
    # Parsing & AST
    "libcst>=1.3",
    # Reports
    "jinja2>=3.1",
    # Dashboard
    "streamlit>=1.37",
    "pandas>=2.2",
    # Rules / schema
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
guardrail = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanners*", "rules*", "reports*", "cli*"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".pytest-tmp", "sample-app", "screenshots", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "ANN",      # flake8-annotations
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["scanners", "rules", "reports", "cli"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
