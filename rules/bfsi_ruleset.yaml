# GuardRail — BFSI/FinTech Compliance Rule Set
# Schema version: 1.0
#
# Each rule contains:
#   id          : Unique rule identifier  (GR-BFSI-NNN)
#   name        : Short human-readable title
#   category    : Logical grouping
#   severity    : CRITICAL | HIGH | MEDIUM | LOW | INFO
#   frameworks  : Regulatory frameworks this rule maps to
#   detection:
#     type      : "regex" | "ast" | "semgrep"
#     patterns  : List of detection patterns (regex strings or semgrep rules)
#     file_glob : Optional glob to restrict which files are scanned
#   explanation : Plain-language description of the risk (shown to developer)
#   fix         : Concrete remediation advice (shown to developer)
#   references  : Links to standards / CWEs
#
# Severity guidance
#   CRITICAL  — exploitable, immediate financial / data loss risk
#   HIGH      — serious vulnerability, must fix before production
#   MEDIUM    — significant risk, fix in current sprint
#   LOW       — minor risk or best-practice deviation
#   INFO      — informational / advisory

ruleset:
  version: "1.0"
  name: "BFSI/FinTech Core Rule Set"
  description: >
    Compliance and security rules for Banking, Financial Services, and Insurance
    (BFSI) / FinTech applications. Covers PCI-DSS, RBI IT Framework, SEBI
    Cybersecurity & Cyber Resilience Framework, SOC 2, ISO 27001, and OWASP Top 10.

rules:

  # ── GR-BFSI-001 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-001
    name: Hardcoded Credentials
    category: Secrets Management
    severity: CRITICAL
    frameworks:
      - PCI-DSS v4.0 Req 8.2.1
      - OWASP A07:2021 Identification and Authentication Failures
      - CWE-798
    detection:
      type: regex
      file_glob: "**/*.{py,js,ts,java,go,rb,php,env,yaml,yml,toml,properties,xml,json}"
      patterns:
        # Assignment of password/secret/token/key to a string literal
        - '(?i)(password|passwd|pwd|secret|api[_-]?key|auth[_-]?token|access[_-]?token|private[_-]?key)\s*=\s*["\x27][^"\x27\s]{4,}["\x27]'
        # Connection strings with credentials embedded
        - '(?i)(jdbc|mongodb|redis|postgres|mysql|mssql):\/\/[^:]+:[^@\/\s]{4,}@'
        # AWS / GCP / Azure key patterns
        - '(?i)(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
        # Generic bearer / basic auth tokens in code
        - '(?i)(Bearer|Basic)\s+[A-Za-z0-9+\/=]{20,}'
    explanation: >
      A credential (password, API key, secret token, or private key) is
      hard-coded directly in source code. If this repository is ever shared,
      committed to version control, or inspected by an insider, the secret is
      immediately exposed — no attack sophistication required. In BFSI
      environments this can lead to full account takeover, unauthorized fund
      transfers, and severe regulatory penalties under PCI-DSS and RBI IT
      Framework.
    fix: >
      1. Revoke the exposed credential immediately.
      2. Move all secrets to an environment variable or a secrets manager
         (AWS Secrets Manager, HashiCorp Vault, Azure Key Vault, or
         GCP Secret Manager).
      3. Reference secrets at runtime via os.environ.get("SECRET_NAME") or
         the secrets-manager SDK — never interpolate them as string literals.
      4. Add a pre-commit hook (e.g. git-secrets, truffleHog, detect-secrets)
         to prevent future accidental commits.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"

  # ── GR-BFSI-002 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-002
    name: SQL Injection Risk
    category: Injection
    severity: CRITICAL
    frameworks:
      - OWASP A03:2021 Injection
      - PCI-DSS v4.0 Req 6.2.4
      - CWE-89
      - RBI IT Framework 6.2 (Application Security)
    detection:
      type: regex
      file_glob: "**/*.{py,js,ts,java,go,rb,php}"
      patterns:
        # String formatting / concatenation fed directly into execute / query
        - '(?i)(execute|query|raw|cursor\.execute)\s*\(\s*["\x27][^"\x27]*(%s|%d|\{|\+)[^"\x27]*["\x27]'
        # Python f-string or % format in SQL context
        - '(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|UNION)\s+.*\s+(f["\x27]|%\s*%\s*\(|\.format\()'
        # Direct string concatenation before variable (Python): "SELECT ... " + variable
        - '(?i)(SELECT|INSERT|UPDATE|DELETE)\s+["\x27][^"\x27]+["\x27]\s*\+\s*\w'
        # String literal opening with SQL keyword followed by concatenation (JS/TS style)
        - '(?i)["\x27](SELECT|INSERT|UPDATE|DELETE|DELETE FROM)\s+[^"\x27]*["\x27]\s*\+'
    explanation: >
      User-supplied or external data is concatenated directly into a SQL
      statement without parameterisation. An attacker can inject arbitrary SQL,
      extract the entire database (including account numbers, KYC data, and
      transaction history), modify balances, or drop tables. This is the most
      exploited vulnerability class in financial applications and results in
      mandatory breach disclosure under RBI and GDPR.
    fix: >
      Always use parameterised queries or a safe ORM:

        # Bad
        cursor.execute("SELECT * FROM accounts WHERE id = " + user_id)

        # Good (parameterised)
        cursor.execute("SELECT * FROM accounts WHERE id = %s", (user_id,))

        # Good (SQLAlchemy ORM)
        session.query(Account).filter(Account.id == user_id).first()

      If raw SQL is required, use your database driver's parameter placeholder
      (e.g. %s for psycopg2, ? for sqlite3, :param for SQLAlchemy text()).
      Never use str.format(), f-strings, or % interpolation to build queries.
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/89.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"

  # ── GR-BFSI-003 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-003
    name: Missing Input Validation on Financial Fields
    category: Input Validation
    severity: HIGH
    frameworks:
      - OWASP A03:2021 Injection
      - PCI-DSS v4.0 Req 6.2.4
      - RBI IT Framework 6.2
      - CWE-20
    detection:
      type: regex
      file_glob: "**/*.{py,js,ts,java}"
      patterns:
        # Financial field names used directly as arithmetic operands without prior validation
        - '(?i)(amount|balance|transfer[_-]?amount|credit|debit|quantity|price|fee)\s*=\s*(?:request\.|req\.|data\.|body\.|params\.|form\.)[a-zA-Z_\[\"\x27]'
        # Type casting without try/except or validation wrapper
        - '(?i)float\s*\(\s*(?:request|req|data|body|params|form)\.'
        - '(?i)int\s*\(\s*(?:request|req|data|body|params|form)\.'
        - '(?i)Decimal\s*\(\s*(?:request|req|data|body|params|form)\.'
    explanation: >
      Financial amounts, account numbers, or quantities read from user input
      or an external API are used in calculations without first validating
      their type, range, sign, and precision. This can cause negative balance
      injection (transferring a negative amount to add funds), integer overflow
      in fee calculations, and floating-point rounding exploits — all of which
      have led to real financial losses and regulatory sanctions in production
      BFSI systems.
    fix: >
      Validate every financial field before use:

        from decimal import Decimal, InvalidOperation

        def parse_amount(raw: str) -> Decimal:
            try:
                value = Decimal(raw)
            except InvalidOperation:
                raise ValueError("Invalid amount format")
            if value <= 0:
                raise ValueError("Amount must be positive")
            if value > MAX_TRANSFER_LIMIT:
                raise ValueError("Amount exceeds transfer limit")
            # Enforce precision (e.g. max 2 decimal places for INR)
            if value.as_tuple().exponent < -2:
                raise ValueError("Amount has too many decimal places")
            return value

      Use Decimal (not float) for all monetary values to avoid floating-point
      rounding errors. Never accept negative amounts unless the business logic
      explicitly requires it.
    references:
      - "https://cwe.mitre.org/data/definitions/20.html"
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://docs.python.org/3/library/decimal.html"

  # ── GR-BFSI-004 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-004
    name: Insecure Password Hashing (MD5 / SHA-1)
    category: Cryptography
    severity: HIGH
    frameworks:
      - PCI-DSS v4.0 Req 8.3.1
      - OWASP A02:2021 Cryptographic Failures
      - NIST SP 800-131A Rev 2
      - CWE-916
    detection:
      type: regex
      file_glob: "**/*.{py,js,ts,java,go,rb,php}"
      patterns:
        # Direct use of MD5 or SHA-1 in hashlib / crypto libs
        - '(?i)hashlib\.(md5|sha1)\s*\('
        - '(?i)md5\s*\('
        - '(?i)sha1\s*\('
        - '(?i)MessageDigest\.getInstance\s*\(\s*["\x27](MD5|SHA-1|SHA1)["\x27]'
        - '(?i)crypto\.createHash\s*\(\s*["\x27](md5|sha1)["\x27]'
        # References to MD5/SHA1 near "password" keyword
        - '(?i)(password|passwd|pwd).{0,80}(md5|sha1|sha-1)'
        - '(?i)(md5|sha1|sha-1).{0,80}(password|passwd|pwd)'
    explanation: >
      MD5 and SHA-1 are cryptographically broken hash functions. Pre-computed
      rainbow tables and GPU-accelerated brute-force tools can reverse
      an MD5 or SHA-1 password hash in seconds to minutes. PCI-DSS v4.0
      explicitly prohibits their use for credential storage. Using them in a
      BFSI application exposes every customer password if the database is
      breached, leading to account takeover, regulatory fines, and reputational
      damage.
    fix: >
      Use a modern, slow, memory-hard password hashing algorithm:

        # Python — bcrypt (recommended)
        import bcrypt
        hashed = bcrypt.hashpw(password.encode(), bcrypt.gensalt(rounds=12))
        bcrypt.checkpw(password.encode(), hashed)

        # Python — argon2-cffi (NIST-recommended post-2023)
        from argon2 import PasswordHasher
        ph = PasswordHasher()
        hashed = ph.hash(password)
        ph.verify(hashed, password)

      Never use MD5, SHA-1, or even SHA-256 without a slow KDF (key derivation
      function) for password storage. For non-password data integrity use
      SHA-256 or SHA-3 minimum.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/916.html"
      - "https://pages.nist.gov/800-63-3/sp800-63b.html#sec5"

  # ── GR-BFSI-005 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-005
    name: Missing Audit-Log on Sensitive Operations
    category: Audit & Logging
    severity: HIGH
    frameworks:
      - PCI-DSS v4.0 Req 10.2.1
      - RBI IT Framework 7 (Audit Trail)
      - SEBI CSCRF Annex B-3
      - ISO 27001 A.12.4
      - CWE-778
    detection:
      type: regex
      file_glob: "**/*.{py,js,ts,java}"
      patterns:
        # Fund transfer functions without an adjacent audit/log call (Python)
        - '(?i)def\s+(transfer|fund_transfer|wire_transfer|remit|debit|credit)\s*\('
        # PII access functions without audit (Python)
        - '(?i)def\s+(get_pii|access_pii|fetch_customer|get_kyc|view_account)\s*\('
        # Login / authentication without audit (Python)
        - '(?i)def\s+(login|authenticate|verify_otp|validate_token)\s*\('
        # Password / credential change without audit (Python)
        - '(?i)def\s+(change_password|reset_password|update_credentials)\s*\('
        # JavaScript / TypeScript function declarations for the same sensitive operations
        - '(?i)function\s+(transfer|fund_transfer|wire_transfer|remit|debit|credit)\s*\('
        - '(?i)function\s+(login|authenticate|verify_otp|validate_token)\s*\('
        - '(?i)function\s+(change_password|changePassword|reset_password|resetPassword)\s*\('
    explanation: >
      Sensitive operations (fund transfers, PII access, authentication events,
      credential changes) appear to be performed without an adjacent audit-log
      call. Comprehensive, tamper-evident audit trails are mandatory under
      PCI-DSS Req 10, RBI IT Framework Section 7, and SEBI CSCRF. Without
      them, fraud investigations are impossible, regulatory audits fail, and
      incident response is severely hampered.
    fix: >
      Every sensitive operation must emit a structured audit event before
      returning, even on failure:

        import logging
        import time

        audit_logger = logging.getLogger("guardrail.audit")

        def transfer_funds(from_account: str, to_account: str, amount: Decimal) -> None:
            audit_logger.info(
                "FUND_TRANSFER_INITIATED",
                extra={
                    "event_type": "FUND_TRANSFER",
                    "from_account": from_account,
                    "to_account": to_account,
                    "amount": str(amount),
                    "user_id": current_user.id,
                    "timestamp": time.time(),
                    "ip_address": request.remote_addr,
                },
            )
            # ... business logic ...

      Route audit logs to an append-only, off-system log store (SIEM, cloud
      logging) that application code cannot delete or modify.
    references:
      - "https://owasp.org/www-project-cheat-sheets/cheatsheets/Logging_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/778.html"
      - "https://www.pcisecuritystandards.org/document_library/?document=pci_dss"

  # ── GR-BFSI-006 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-006
    name: Unencrypted PII Storage
    category: Data Protection
    severity: CRITICAL
    frameworks:
      - PCI-DSS v4.0 Req 3.5
      - GDPR Art. 5(1)(f) / Art. 32
      - RBI IT Framework 4 (Data Security)
      - DPDP Act 2023 (India)
      - CWE-312
    detection:
      type: regex
      file_glob: "**/*.{py,js,ts,java}"
      patterns:
        # Model / ORM fields for PII stored as plain strings with no encryption decorator/field type
        - '(?i)(pan_number|aadhaar|ssn|national_id|passport|dob|date_of_birth|phone|mobile|email)\s*=\s*(models\.|Column\(|db\.Column\()(String|Text|Char|VARCHAR)'
        # Direct dict / JSON writes of PII fields without encryption call
        - '(?i)["\x27](pan|aadhaar|ssn|passport_no|dob|phone_number|email_address)["\x27]\s*:\s*(?!encrypt|cipher|fernet|kms)'
        # Serialise PII to plain JSON file
        - '(?i)json\.(dump|dumps)\s*\(.*\b(pan|aadhaar|ssn|passport|dob|phone|email)\b'
    explanation: >
      Personally Identifiable Information (PAN numbers, Aadhaar, SSN,
      passports, dates of birth, phone numbers, e-mail addresses) appears to
      be stored in plaintext columns or written to unencrypted JSON. Under
      PCI-DSS, RBI Data Localisation norms, and the DPDP Act 2023, PII must
      be encrypted at rest using an approved algorithm (AES-256-GCM). A single
      database breach exposes every customer's identity, triggering mandatory
      RBI/SEBI incident reports, potential licence revocation, and
      class-action liability.
    fix: >
      Encrypt PII at the field / application level before persisting:

        from cryptography.fernet import Fernet

        # Key must come from KMS / secrets manager, never hardcoded
        fernet = Fernet(os.environ["FIELD_ENCRYPTION_KEY"])

        # Encrypt before save
        encrypted_pan = fernet.encrypt(pan_number.encode()).decode()

        # Decrypt on read
        plain_pan = fernet.decrypt(encrypted_pan.encode()).decode()

      For Django/SQLAlchemy consider django-fernet-fields or
      sqlalchemy-utils EncryptedType. Ensure encryption keys are rotated
      according to your key-management policy (annual minimum per PCI-DSS).
    references:
      - "https://owasp.org/www-project-cheat-sheets/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/312.html"
      - "https://www.meity.gov.in/writereaddata/files/Digital%20Personal%20Data%20Protection%20Act%202023.pdf"

  # ── GR-BFSI-007 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-007
    name: Missing Rate-Limiting on Authentication Endpoints
    category: Access Control
    severity: HIGH
    frameworks:
      - OWASP A07:2021 Identification and Authentication Failures
      - PCI-DSS v4.0 Req 8.3.4
      - RBI IT Framework 5.3 (Access Control)
      - CWE-307
    detection:
      type: regex
      file_glob: "**/*.{py,js,ts,java}"
      patterns:
        # Flask / FastAPI / Django route decorators on auth paths with no rate-limit decorator nearby
        - '(?i)@(app|router|blueprint)\.(route|post|get)\s*\(\s*["\x27][^"\x27]*(login|signin|auth|otp|token|password|forgot)[^"\x27]*["\x27]'
        # Express.js route registration for auth endpoints
        - '(?i)(router|app)\.(post|get)\s*\(\s*["\x27][^"\x27]*(login|signin|auth|otp|token|password|reset)[^"\x27]*["\x27]'
        # Spring @PostMapping / @GetMapping on auth controllers
        - '(?i)@(Post|Get|Request)Mapping\s*\(\s*["\x27][^"\x27]*(login|auth|token|otp)[^"\x27]*["\x27]'
    explanation: >
      Authentication endpoints (login, OTP verification, password reset, token
      issuance) are defined without any visible rate-limiting or account
      lockout mechanism. Without rate-limiting, an attacker can perform
      credential-stuffing or brute-force attacks at machine speed — testing
      millions of password combinations against customer accounts. PCI-DSS
      Req 8.3.4 mandates lockout after 10 failed attempts. A successful
      attack gives full account access and the ability to authorise fraudulent
      transactions.
    fix: >
      Apply rate-limiting at the framework or infrastructure level:

        # Flask — flask-limiter
        from flask_limiter import Limiter
        limiter = Limiter(app, key_func=get_remote_address)

        @app.route("/login", methods=["POST"])
        @limiter.limit("5 per minute; 20 per hour")
        def login(): ...

        # FastAPI — slowapi
        from slowapi import Limiter
        from slowapi.util import get_remote_address
        limiter = Limiter(key_func=get_remote_address)

        @router.post("/login")
        @limiter.limit("5/minute")
        async def login(request: Request): ...

      Additionally implement:
        - Progressive delays after N failed attempts
        - Account lockout after 10 failures (PCI-DSS minimum)
        - CAPTCHA after 3–5 failures
        - Alerting / audit log on repeated failures from same IP
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"

  # ── GR-BFSI-008 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-008
    name: Dangerous subprocess / eval Usage
    category: Code Injection
    severity: CRITICAL
    frameworks:
      - OWASP A03:2021 Injection
      - CWE-78
      - CWE-95
      - PCI-DSS v4.0 Req 6.2.4
    detection:
      type: ast
      file_glob: "**/*.{py,js,ts,jsx,tsx}"
      patterns:
        # Python AST — bare eval / exec calls
        - "call:eval"
        - "call:exec"
        # Python AST — subprocess with shell=True
        - "kw:shell=True"
        # Python AST — os.system call
        - "call:os.system"
        # Python AST — os.popen
        - "call:os.popen"
    explanation: >
      The use of eval(), exec(), or subprocess with shell=True allows arbitrary
      code execution if any part of the input originates from an untrusted
      source. In a BFSI environment this can lead to complete server compromise,
      data exfiltration, and regulatory breach (PCI-DSS Req 6.2.4, CWE-78/95).
      Even internal callers can become an attack vector if upstream data
      is tampered with through a supply-chain or insider attack.
    fix: >
      1. Replace eval/exec with explicit parsers or safe alternatives:
           # Bad
           result = eval(user_expression)
           # Good — use ast.literal_eval for safe Python literal parsing
           import ast
           result = ast.literal_eval(user_expression)

      2. Replace subprocess shell=True with a list of arguments:
           # Bad
           subprocess.run(f"convert {filename}", shell=True)
           # Good
           subprocess.run(["convert", filename], shell=False)

      3. Never pass user-controlled data to os.system() or os.popen().
         Use the subprocess module with a list of arguments instead.
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/78.html"
      - "https://cwe.mitre.org/data/definitions/95.html"
      - "https://docs.python.org/3/library/subprocess.html#security-considerations"

  # ── GR-BFSI-009 ───────────────────────────────────────────────────────────
  - id: GR-BFSI-009
    name: TLS Certificate Verification Disabled
    category: Cryptography
    severity: HIGH
    frameworks:
      - OWASP A02:2021 Cryptographic Failures
      - PCI-DSS v4.0 Req 4.2.1
      - CWE-295
      - RBI IT Framework 4.3 (Encryption in Transit)
    detection:
      type: ast
      file_glob: "**/*.{py,js,ts,jsx,tsx}"
      patterns:
        # Python AST — requests.get/post/put/patch/delete with verify=False
        - "kw:verify=False"
        # Python AST — ssl context with check_hostname disabled
        - "assign_attr:check_hostname"
        # Python AST — ssl context with verify_mode set (may be CERT_NONE)
        - "assign_attr:verify_mode"
    explanation: >
      TLS certificate verification is being disabled (verify=False or
      check_hostname=False). This removes the only protection against
      man-in-the-middle attacks on HTTPS connections. In a BFSI system,
      an attacker positioned on the network can intercept and modify
      payment instructions, authentication tokens, and customer PII with
      no visible indication. PCI-DSS Req 4.2.1 mandates strong TLS with
      proper certificate validation for all cardholder data transmissions.
    fix: >
      Never disable TLS certificate verification in production code:

        # Bad
        requests.get(url, verify=False)

        # Good
        requests.get(url, verify=True)          # default — can be omitted
        requests.get(url, verify="/path/to/ca-bundle.crt")  # custom CA

        # For ssl.SSLContext always use the secure defaults:
        ctx = ssl.create_default_context()
        # Do NOT set: ctx.check_hostname = False
        # Do NOT set: ctx.verify_mode = ssl.CERT_NONE

      If you encounter self-signed certificates in a test environment use a
      local CA bundle rather than disabling verification entirely.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://requests.readthedocs.io/en/latest/user/advanced/#ssl-cert-verification"
